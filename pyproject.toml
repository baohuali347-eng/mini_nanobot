[project]
name = "mini-nanobot"
version = "0.5.0"
description = "中文 AI 编程助手：工具、多 agent、会话和项目记忆"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "aiohttp>=3.14.3,<4",
  "httpx[socks]>=0.28,<1",
  "python-dotenv>=1,<2",
  "jsonschema>=4.23,<5",
  "typer>=0.20,<1",
  "filelock>=3.25,<4",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "ruff>=0.1"]

[project.scripts]
mini_nanobot = "mini_nanobot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mini_nanobot"]
artifacts = ["mini_nanobot/web/**"]

[tool.hatch.build.targets.sdist]
include = ["mini_nanobot/", "webui/", "tests/", "docs/", "scripts/", "README.md", "AGENTS.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "pyproject.toml", ".env.example"]
exclude = ["webui/node_modules/", "**/__pycache__/", "**/.vite/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
